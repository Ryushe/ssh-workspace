name: Windows client
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and exercise Windows client
        shell: powershell
        run: |
          ./install.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Join-Path $env:LOCALAPPDATA 'ssh-workspace\bin\ssh-workspace.exe'
          $wrapper = Join-Path $env:RUNNER_TEMP 'ssh-example.ps1'
          & $exe generate --name example --output $wrapper
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $result = & $wrapper default herdr
          if ($LASTEXITCODE -ne 0 -or $result -ne 'herdr') { throw 'Generated wrapper failed' }
          $result = & $wrapper default
          if ($LASTEXITCODE -ne 0 -or $result -ne 'herdr') { throw 'Default was not saved' }
          # Exercise native Windows SSH config permissions and identity paths.
          $oldProfile = $env:USERPROFILE
          $testProfile = Join-Path $env:RUNNER_TEMP ('ssh-profile-' + [guid]::NewGuid())
          New-Item -ItemType Directory $testProfile | Out-Null
          try {
            $env:USERPROFILE = $testProfile
            $key = Join-Path $testProfile 'key name'
            & $exe host set --name example --host 192.0.2.10 --user alice --key $key
            if ($LASTEXITCODE -ne 0) { throw 'Host setup failed' }
            $resolved = & ssh.exe -T -G -F (Join-Path $testProfile '.ssh\config') example
            if ($LASTEXITCODE -ne 0 -or $resolved -notcontains 'hostname 192.0.2.10' -or
                $resolved -notcontains 'user alice' -or $resolved -notcontains "identityfile $key") {
              throw 'Native SSH could not resolve the managed host and identity'
            }
          } finally {
            $env:USERPROFILE = $oldProfile
            Remove-Item -LiteralPath $testProfile -Recurse -Force
          }
          & $exe wsl use Ubuntu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $exe generate --name example --output $wrapper
          if ($LASTEXITCODE -ne 0 -or -not ((Get-Content -Raw $wrapper) -match "'--wsl-distro' 'Ubuntu'")) { throw 'WSL selection was not saved' }
